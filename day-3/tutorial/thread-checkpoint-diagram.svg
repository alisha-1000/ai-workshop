<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace">
  <rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>

  <!-- Column headers implied by row labels; vertical guide lines -->
  <line x1="800" y1="10" x2="800" y2="390" stroke="#dddddd" stroke-width="1"/>

  <!-- Row 1: Graph -->
  <text x="150" y="45" font-size="20" text-anchor="end" fill="#111111">Graph</text>
  <text x="185" y="35" font-size="13" fill="#333333">{state: "I"}</text>
  <text x="335" y="18" font-size="13" text-anchor="middle" fill="#333333">Node 1</text>
  <line x1="230" y1="40" x2="310" y2="40" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="335" cy="40" r="20" fill="#f6b3ae" stroke="#111111" stroke-width="1.5"/>
  <text x="515" y="18" font-size="13" text-anchor="middle" fill="#333333">Node 2</text>
  <line x1="360" y1="40" x2="490" y2="40" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="515" cy="40" r="20" fill="#aecdf5" stroke="#111111" stroke-width="1.5"/>
  <line x1="540" y1="40" x2="620" y2="40" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="35" font-size="13" fill="#333333">{state: "I heart langgraph"}</text>
  <text x="820" y="45" font-size="15" fill="#111111">Control flow of nodes, edges</text>

  <!-- Row 2: Super-steps -->
  <text x="150" y="115" font-size="20" text-anchor="end" fill="#111111">Super-steps</text>
  <circle cx="335" cy="110" r="20" fill="#f6b3ae" stroke="#111111" stroke-width="1.5"/>
  <circle cx="515" cy="110" r="20" fill="#aecdf5" stroke="#111111" stroke-width="1.5"/>
  <text x="820" y="102" font-size="15" fill="#111111">Each sequential node is a separate</text>
  <text x="820" y="122" font-size="15" fill="#111111">super-step, while parallel nodes</text>
  <text x="820" y="142" font-size="15" fill="#111111">share the same super-step</text>

  <!-- Row 3: Checkpoints -->
  <text x="150" y="205" font-size="20" text-anchor="end" fill="#111111">Checkpoints</text>
  <rect x="270" y="165" width="150" height="90" rx="12" fill="#f6b3ae" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="187" font-size="11.5" fill="#111111">state: "I heart"</text>
  <text x="280" y="204" font-size="11.5" fill="#111111">next: node 2</text>
  <text x="280" y="221" font-size="11.5" fill="#111111">id: ...</text>
  <text x="280" y="238" font-size="11.5" fill="#111111">etc ...</text>

  <rect x="450" y="155" width="190" height="100" rx="12" fill="#aecdf5" stroke="#111111" stroke-width="1.5"/>
  <text x="460" y="178" font-size="11.5" fill="#111111">state: "I heart langgraph"</text>
  <text x="460" y="195" font-size="11.5" fill="#111111">next: end</text>
  <text x="460" y="212" font-size="11.5" fill="#111111">id: ...</text>
  <text x="460" y="229" font-size="11.5" fill="#111111">etc ...</text>

  <text x="820" y="192" font-size="15" fill="#111111">State and relevant metadata</text>
  <text x="820" y="212" font-size="15" fill="#111111">packaged at every super-step</text>

  <!-- Row 4: Thread -->
  <text x="150" y="298" font-size="20" text-anchor="end" fill="#111111">Thread</text>
  <rect x="270" y="270" width="380" height="60" rx="6" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="310" y="285" width="70" height="30" rx="8" fill="#f6b3ae" stroke="#111111" stroke-width="1.5"/>
  <rect x="470" y="285" width="90" height="30" rx="8" fill="#aecdf5" stroke="#111111" stroke-width="1.5"/>
  <text x="820" y="305" font-size="15" fill="#111111">Collection of checkpoints</text>

  <!-- Row 5: StateSnapshot -->
  <text x="150" y="368" font-size="16" text-anchor="end" fill="#111111">StateSnapshot</text>
  <text x="345" y="368" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold">StateSnapshot()</text>
  <text x="515" y="368" font-size="14" text-anchor="middle" fill="#2266cc" font-weight="bold">StateSnapshot()</text>
  <text x="820" y="368" font-size="15" fill="#111111">Type for checkpoints</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
</svg>
