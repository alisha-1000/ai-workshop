<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="gr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="am" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="v" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- header -->
  <rect x="0" y="0" width="1280" height="96" fill="#0b1220"/>
  <text x="48" y="40" font-size="14" font-weight="700" letter-spacing="2" fill="#a78bfa">DAY 2 · GRAPH EXECUTION</text>
  <text x="48" y="74" font-size="30" font-weight="700" fill="#ffffff">Human-in-the-loop — pause, decide, resume</text>

  <text x="48" y="138" font-size="18" fill="#334155"><tspan font-family="monospace" font-weight="700" fill="#7c3aed">interrupt()</tspan> pauses the graph and hands the decision to a person; <tspan font-family="monospace" font-weight="700" fill="#2563eb">Command(resume=…)</tspan> continues it.</text>

  <!-- LEFT visual panel -->
  <rect x="48" y="162" width="700" height="426" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- retry loop arc -->
  <path d="M405,214 C405,176 235,176 235,214" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#gr)"/>
  <text x="320" y="170" font-size="13.5" text-anchor="middle" fill="#15803d" font-weight="600">retry (iteration &lt; limit)</text>

  <!-- top flow row -->
  <rect x="74" y="222" width="74" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="111" y="247" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">START</text>
  <line x1="148" y1="242" x2="172" y2="242" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="174" y="218" width="122" height="48" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="235" y="240" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze</text>
  <text x="235" y="257" font-size="10.5" text-anchor="middle" fill="#3b82f6">model proposes a step</text>
  <line x1="296" y1="242" x2="326" y2="242" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="328" y="218" width="150" height="48" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="403" y="240" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">human_review</text>
  <text x="403" y="257" font-size="10.5" text-anchor="middle" fill="#3b82f6">interrupt() — pauses here</text>
  <path d="M478,242 L556,242" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#am)"/>
  <text x="518" y="232" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="600">end / limit</text>
  <rect x="558" y="222" width="70" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="593" y="247" font-size="14" font-weight="600" text-anchor="middle" fill="#334155">END</text>

  <!-- interrupt / resume -->
  <path d="M384,268 L384,360" stroke="#7c3aed" stroke-width="2.4" fill="none" marker-end="url(#v)"/>
  <path d="M424,362 L424,270" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#b)"/>
  <text x="300" y="312" font-size="12.5" text-anchor="end" font-weight="700" fill="#7c3aed">interrupt()</text>
  <text x="300" y="330" font-size="11" text-anchor="end" fill="#8b5cf6">diagnosis + fix out</text>
  <text x="470" y="312" font-size="12.5" font-weight="700" fill="#2563eb">Command(resume=…)</text>
  <text x="470" y="330" font-size="11" fill="#3b82f6">your choice re-enters</text>

  <!-- person box -->
  <rect x="300" y="362" width="210" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <circle cx="336" cy="392" r="9" fill="#7c3aed"/>
  <path d="M321,418 a15,15 0 0,1 30,0 Z" fill="#7c3aed"/>
  <text x="366" y="392" font-size="15" font-weight="700" fill="#5b21b6">You review the step</text>
  <text x="366" y="413" font-size="13" fill="#6d28d9">decide: <tspan font-weight="700" fill="#15803d">retry</tspan> or <tspan font-weight="700" fill="#b45309">end</tspan></text>
  <text x="366" y="431" font-size="11" fill="#8b5cf6">the pause can last as long as you need</text>

  <!-- notes bottom of panel -->
  <text x="72" y="486" font-size="13.5" fill="#64748b">A <tspan font-family="monospace">MemorySaver</tspan> checkpointer keyed by <tspan font-family="monospace">thread_id</tspan> holds the run</text>
  <text x="72" y="508" font-size="13.5" fill="#64748b">across the pause, so a later <tspan font-family="monospace">invoke</tspan> resumes it.</text>
  <text x="72" y="544" font-size="13.5" fill="#0f172a"><tspan font-weight="700">The limit still stops the loop</tspan> even if you answer <tspan font-weight="700">retry</tspan> every time.</text>

  <!-- RIGHT column -->
  <text x="784" y="196" font-size="20" font-weight="700" fill="#0f172a">Three deciders, one loop</text>
  <circle cx="792" cy="228" r="4" fill="#2563eb"/>
  <text x="808" y="233" font-size="16" fill="#334155"><tspan font-weight="700">Model</tspan> proposes the next diagnosis and fix.</text>
  <circle cx="792" cy="262" r="4" fill="#7c3aed"/>
  <text x="808" y="267" font-size="16" fill="#334155"><tspan font-weight="700">Human</tspan> reviews each step: retry or end.</text>
  <circle cx="792" cy="296" r="4" fill="#16a34a"/>
  <text x="808" y="301" font-size="16" fill="#334155"><tspan font-weight="700">Code</tspan> enforces the iteration limit — the final guard.</text>

  <!-- code block -->
  <rect x="784" y="330" width="448" height="218" rx="10" fill="#0b1220"/>
  <g font-family="monospace" font-size="15" xml:space="preserve">
    <text x="806" y="362" fill="#e2e8f0">result = graph.<tspan fill="#93c5fd">invoke</tspan>(inputs, config)</text>
    <text x="806" y="392" fill="#e2e8f0">while <tspan fill="#86efac">"__interrupt__"</tspan> in result:</text>
    <text x="806" y="418" fill="#e2e8f0">    answer = input(<tspan fill="#86efac">"retry / end? "</tspan>)</text>
    <text x="806" y="444" fill="#e2e8f0">    result = graph.<tspan fill="#93c5fd">invoke</tspan>(</text>
    <text x="806" y="470" fill="#e2e8f0">        Command(resume=answer),</text>
    <text x="806" y="496" fill="#e2e8f0">        config)</text>
    <text x="806" y="528" fill="#64748b">    # each resume = its own trace</text>
  </g>

  <!-- footer takeaway -->
  <rect x="48" y="612" width="1184" height="60" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="72" y="649" font-size="17" fill="#0f172a"><tspan font-weight="700">The model proposes, a person decides</tspan> — and deterministic code still enforces the limit.</text>
</svg>
