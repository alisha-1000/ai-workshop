<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="v" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="gb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#cbd5e1"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Concept 2 &#8212; Checkpoints &amp; state updates</text>
  <text x="40" y="72" font-size="13.5" fill="#64748b">A checkpointer snapshots the whole state after every superstep; <tspan font-family="monospace">update_state</tspan> appends a new snapshot.</text>

  <text x="60" y="118" font-size="12.5" font-weight="600" fill="#334155">get_state_history(config) &#8212; newest first</text>
  <line x1="55" y1="126" x2="600" y2="126" stroke="#e2e8f0"/>

  <!-- checkpoint cards -->
  <!-- ck0 -->
  <rect x="60" y="140" width="160" height="120" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="72" y="162" font-size="12" font-weight="700" fill="#1e3a8a">ckpt 0 &#183; input</text>
  <text x="72" y="184" font-size="11" font-family="monospace" fill="#334155">step: -1</text>
  <text x="72" y="202" font-size="11" font-family="monospace" fill="#334155">values: problem, code</text>
  <text x="72" y="224" font-size="11" font-family="monospace" fill="#334155">next: (syntax,</text>
  <text x="112" y="240" font-size="11" font-family="monospace" fill="#334155">runtime, logic)</text>
  <!-- ck1 -->
  <rect x="260" y="140" width="160" height="120" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="272" y="162" font-size="12" font-weight="700" fill="#1e3a8a">ckpt 1</text>
  <text x="272" y="184" font-size="11" font-family="monospace" fill="#334155">step: 0</text>
  <text x="272" y="202" font-size="11" font-family="monospace" fill="#334155">values: +diagnoses[3]</text>
  <text x="272" y="224" font-size="11" font-family="monospace" fill="#334155">next: (finalize)</text>
  <!-- ck2 -->
  <rect x="460" y="140" width="160" height="120" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="472" y="162" font-size="12" font-weight="700" fill="#1e3a8a">ckpt 2</text>
  <text x="472" y="184" font-size="11" font-family="monospace" fill="#334155">step: 1</text>
  <text x="472" y="202" font-size="11" font-family="monospace" fill="#334155">values: +answer</text>
  <text x="472" y="224" font-size="11" font-family="monospace" fill="#16a34a">next: () &#10003; done</text>

  <!-- forward arrows -->
  <path d="M220,200 L256,200" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <path d="M420,200 L456,200" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <!-- parent back-pointers -->
  <path d="M260,250 C240,268 240,268 224,250" stroke="#cbd5e1" stroke-width="1.3" fill="none" marker-end="url(#gb)"/>
  <path d="M460,250 C440,268 440,268 424,250" stroke="#cbd5e1" stroke-width="1.3" fill="none" marker-end="url(#gb)"/>
  <text x="300" y="284" font-size="10.5" fill="#94a3b8" font-family="monospace">parent_config &#8592;</text>

  <!-- get_state pointer -->
  <path d="M540,296 L540,264" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#b)"/>
  <text x="540" y="312" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="600">get_state(config) &#8594; latest</text>

  <!-- appended update card -->
  <path d="M620,180 C660,180 660,180 700,180" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <text x="700" y="132" font-size="12" fill="#7c3aed" font-weight="700">update_state(&#8230;, as_node="finalize")</text>
  <rect x="700" y="140" width="230" height="120" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="714" y="162" font-size="12" font-weight="700" fill="#5b21b6">ckpt 3 &#183; a NEW checkpoint</text>
  <text x="714" y="184" font-size="11" font-family="monospace" fill="#4c1d95">step: 2</text>
  <text x="714" y="202" font-size="11" font-family="monospace" fill="#4c1d95">values: diagnoses[4]</text>
  <text x="714" y="220" font-size="10.5" fill="#6d28d9">reducer appended, did not replace</text>
  <text x="714" y="240" font-size="11" font-family="monospace" fill="#16a34a">next: ()</text>

  <!-- legend -->
  <rect x="40" y="340" width="890" height="58" rx="10" fill="#0b1220"/>
  <text x="58" y="366" font-size="12" font-family="monospace" fill="#93c5fd">StateSnapshot</text>
  <text x="150" y="366" font-size="12" font-family="monospace" fill="#e2e8f0">= values &#183; next &#183; config(thread_id, checkpoint_id) &#183; metadata(source, step) &#183; parent_config</text>
  <text x="58" y="386" font-size="11.5" font-family="monospace" fill="#64748b">get_state = latest &#183; get_state_history = all (newest first) &#183; update_state = append a new snapshot</text>

  <!-- callout -->
  <rect x="40" y="416" width="890" height="108" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="444" font-size="12.5" fill="#0f172a"><tspan font-weight="700">History is append-only.</tspan> Each superstep adds one checkpoint; <tspan font-family="monospace">update_state</tspan> adds another rather than editing in place.</text>
  <text x="58" y="470" font-size="12.5" fill="#0f172a">Every snapshot points to its <tspan font-family="monospace">parent</tspan>, so the whole thread can be replayed or resumed from any point.</text>
  <text x="58" y="496" font-size="12.5" fill="#0f172a"><tspan font-weight="700">MemorySaver</tspan> keeps this only in the running process &#8212; restart the kernel and the history is gone (the MLflow traces remain).</text>
</svg>
