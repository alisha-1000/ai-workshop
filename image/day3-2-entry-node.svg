<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="gr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#cbd5e1"/></marker>
  </defs>
  <rect x="1" y="1" width="978" height="518" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Concept 3 &#8212; Start at a particular node</text>
  <text x="40" y="72" font-size="13.5" fill="#64748b">Seed a thread's state, then <tspan font-family="monospace">invoke(None)</tspan> to enter the graph wherever you positioned it.</text>

  <!-- Lane A: normal -->
  <rect x="30" y="100" width="920" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="126" font-size="14" font-weight="700" fill="#334155">Normal &#8212; <tspan font-family="monospace" font-weight="400">invoke(state)</tspan> enters at START</text>
  <rect x="60" y="160" width="72" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="96" y="185" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">START</text>
  <line x1="132" y1="180" x2="186" y2="180" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="188" y="156" width="150" height="48" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="263" y="178" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">triage</text>
  <text x="263" y="194" font-size="10" text-anchor="middle" fill="#b45309">model call</text>
  <line x1="338" y1="180" x2="404" y2="180" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="371" y="172" font-size="10" text-anchor="middle" fill="#64748b">route</text>
  <rect x="406" y="156" width="150" height="48" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="481" y="184" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">logic</text>
  <line x1="556" y1="180" x2="610" y2="180" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="612" y="160" width="66" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="645" y="185" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">END</text>

  <!-- Lane B: seeded -->
  <rect x="30" y="270" width="920" height="168" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="296" font-size="14" font-weight="700" fill="#334155">Seeded &#8212; enter the <tspan fill="#2563eb">logic</tspan> node directly, skipping triage</text>

  <rect x="60" y="322" width="286" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="74" y="346" font-size="11.5" font-family="monospace" fill="#5b21b6">update_state(cfg,</text>
  <text x="74" y="363" font-size="11.5" font-family="monospace" fill="#5b21b6">&#160;&#160;{"category": "logic", &#8230;},</text>
  <text x="74" y="380" font-size="11.5" font-family="monospace" fill="#5b21b6">&#160;&#160;as_node="triage")</text>

  <path d="M346,357 L404,357" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
  <rect x="406" y="330" width="150" height="54" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="481" y="352" font-size="13" text-anchor="middle" fill="#94a3b8">triage</text>
  <text x="481" y="370" font-size="10" text-anchor="middle" fill="#94a3b8">skipped &#8212; no model call</text>

  <path d="M556,357 L618,357" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#gr)"/>
  <text x="588" y="348" font-size="10" text-anchor="middle" fill="#16a34a" font-family="monospace">next=('logic',)</text>
  <rect x="620" y="330" width="150" height="54" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="695" y="353" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">logic</text>
  <text x="695" y="371" font-size="10" text-anchor="middle" fill="#16a34a">invoke(None) enters here</text>
  <line x1="770" y1="357" x2="820" y2="357" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#g)"/>
  <rect x="822" y="337" width="66" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="855" y="362" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155">END</text>

  <!-- callout -->
  <rect x="40" y="456" width="900" height="50" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="58" y="486" font-size="12.5" fill="#0f172a"><tspan font-family="monospace">get_state(cfg).next</tspan> names the node you'll enter. Useful for <tspan font-weight="700">replay</tspan>, <tspan font-weight="700">resume after a pause</tspan>, and <tspan font-weight="700">testing one node</tspan> with a known input.</text>
</svg>
