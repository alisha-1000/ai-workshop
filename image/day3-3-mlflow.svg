<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="998" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Concept 4 &#8212; See all run data in MLflow</text>
  <text x="40" y="72" font-size="13.5" fill="#64748b"><tspan font-family="monospace">autolog</tspan> traces every run; tag each with its agent, then list them with <tspan font-family="monospace">mlflow.search_traces</tspan>.</text>

  <!-- three agents -->
  <text x="48" y="116" font-size="12.5" font-weight="700" fill="#334155">run each graph</text>
  <rect x="40" y="128" width="210" height="52" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="150" font-size="13" font-weight="600" fill="#1e3a8a">Simple Retry</text>
  <text x="56" y="168" font-size="10.5" fill="#3b82f6">Day 1 &#183; 1 trace</text>

  <rect x="40" y="190" width="210" height="52" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="56" y="212" font-size="13" font-weight="600" fill="#1e3a8a">Multi-State</text>
  <text x="56" y="230" font-size="10.5" fill="#3b82f6">Day 1 &#183; 1 trace</text>

  <rect x="40" y="252" width="210" height="60" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="56" y="274" font-size="13" font-weight="600" fill="#5b21b6">Human-in-the-Loop</text>
  <text x="56" y="292" font-size="10.5" fill="#7c3aed">Day 2 &#183; 3 traces (invoke + 2 resumes)</text>

  <!-- autolog arrow -->
  <path d="M250,220 L326,220" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
  <text x="288" y="210" font-size="10.5" text-anchor="middle" fill="#64748b" font-family="monospace">autolog</text>
  <text x="288" y="238" font-size="9.5" text-anchor="middle" fill="#94a3b8">+ tag agent</text>

  <!-- MLflow trace list -->
  <rect x="332" y="120" width="628" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="332" y="120" width="628" height="34" rx="10" fill="#0b1220"/>
  <rect x="332" y="138" width="628" height="16" fill="#0b1220"/>
  <text x="350" y="142" font-size="12.5" font-weight="700" fill="#ffffff" font-family="monospace">experiment: day-3-graph-mechanics &#183; Traces (5)</text>
  <!-- header -->
  <text x="350" y="178" font-size="11.5" font-weight="700" fill="#64748b" font-family="monospace">trace_id</text>
  <text x="560" y="178" font-size="11.5" font-weight="700" fill="#64748b" font-family="monospace">tags.agent</text>
  <text x="742" y="178" font-size="11.5" font-weight="700" fill="#64748b" font-family="monospace">status</text>
  <text x="852" y="178" font-size="11.5" font-weight="700" fill="#64748b" font-family="monospace">ms</text>
  <line x1="348" y1="186" x2="944" y2="186" stroke="#e2e8f0"/>
  <g font-family="monospace" font-size="11.5" fill="#334155">
    <text x="350" y="208">tr-a1&#8230;</text><text x="560" y="208" fill="#2563eb">simple-retry</text><text x="742" y="208" fill="#16a34a">OK</text><text x="852" y="208">4120</text>
    <text x="350" y="230">tr-b2&#8230;</text><text x="560" y="230" fill="#2563eb">multi-state</text><text x="742" y="230" fill="#16a34a">OK</text><text x="852" y="230">1980</text>
    <text x="350" y="252">tr-c3&#8230;</text><text x="560" y="252" fill="#7c3aed">hitl</text><text x="742" y="252" fill="#16a34a">OK</text><text x="852" y="252">1550</text>
    <text x="350" y="274">tr-c4&#8230;</text><text x="560" y="274" fill="#7c3aed">hitl</text><text x="742" y="274" fill="#16a34a">OK</text><text x="852" y="274">1610</text>
    <text x="350" y="296">tr-c5&#8230;</text><text x="560" y="296" fill="#7c3aed">hitl</text><text x="742" y="296" fill="#16a34a">OK</text><text x="852" y="296">1490</text>
  </g>
  <line x1="348" y1="308" x2="944" y2="308" stroke="#e2e8f0"/>
  <text x="350" y="332" font-size="11.5" fill="#7c3aed" font-family="monospace">filter_string="tags.agent = 'hitl'"  &#8594;  3 traces (one thread, one per invoke/resume)</text>
  <text x="350" y="350" font-size="11" fill="#64748b">Simple Retry &amp; Multi-State: 1 trace each &#183; HITL: 3</text>

  <!-- code + callout -->
  <rect x="40" y="380" width="920" height="52" rx="9" fill="#0b1220"/>
  <text x="58" y="404" font-size="12.5" font-family="monospace" fill="#e2e8f0">exp = mlflow.get_experiment_by_name("day-3-graph-mechanics")</text>
  <text x="58" y="422" font-size="12.5" font-family="monospace" fill="#93c5fd">traces = mlflow.search_traces(experiment_ids=[exp.experiment_id])  <tspan fill="#64748b"># pandas DataFrame, one row per trace</tspan></text>

  <rect x="40" y="446" width="920" height="78" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="472" font-size="12.5" fill="#0f172a">Each row carries the request, response, <tspan font-family="monospace">status</tspan>, latency (<tspan font-family="monospace">execution_time_ms</tspan>), tags, and the full span tree &#8212; list or filter them in code or the UI.</text>
  <text x="58" y="498" font-size="12.5" fill="#0f172a"><tspan font-weight="700">One HITL thread makes several traces</tspan> (one per invoke/resume). Status <tspan font-family="monospace">OK</tspan> means finished, <tspan font-weight="700">not</tspan> correct &#8212; read the spans.</text>
</svg>
