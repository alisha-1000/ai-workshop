<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="938" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Streaming &#8212; a worked example</text>
  <text x="40" y="65" font-size="13.5" fill="#64748b">Same debug run, delivered two ways: two <tspan font-family="monospace">analyze</tspan> steps on the knapsack bug, then done.</text>

  <!-- input box -->
  <rect x="30" y="84" width="880" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="104" font-size="12" font-weight="700" fill="#334155">INPUT</text>
  <text x="46" y="122" font-size="12" font-family="monospace" fill="#475569">buggy knapsack uses <tspan fill="#b91c1c">range(weight, capacity+1)</tspan> &#183; test &#8220;1 4 / 2 3&#8221; prints <tspan fill="#b91c1c">6</tspan>, expected <tspan fill="#15803d">3</tspan></text>

  <!-- ===== STREAM terminal ===== -->
  <rect x="30" y="152" width="430" height="332" rx="10" fill="#0b1220" stroke="#16a34a"/>
  <rect x="30" y="152" width="430" height="32" rx="10" fill="#16a34a"/>
  <rect x="30" y="170" width="430" height="14" fill="#16a34a"/>
  <text x="48" y="173" font-size="13" font-weight="700" fill="#ffffff">stream(&#8230;, stream_mode="updates")</text>

  <g font-family="monospace" font-size="12.5">
    <text x="48" y="214" fill="#64748b">0.0s</text><text x="92" y="214" fill="#e2e8f0">&#9654; run started</text>
    <text x="48" y="248" fill="#64748b">1.2s</text><text x="92" y="248" fill="#4ade80">[step 1]</text><text x="164" y="248" fill="#e2e8f0">upward loop reuses the item</text>
    <text x="48" y="282" fill="#64748b">2.3s</text><text x="92" y="282" fill="#4ade80">[step 2]</text><text x="164" y="282" fill="#e2e8f0">fix: iterate capacity downward</text>
    <text x="48" y="316" fill="#64748b">2.6s</text><text x="92" y="316" fill="#4ade80">&#10003; done</text><text x="164" y="316" fill="#e2e8f0">&#8212; 2 steps</text>
  </g>
  <line x1="48" y1="338" x2="442" y2="338" stroke="#1e293b"/>
  <text x="48" y="360" font-size="11.5" font-family="monospace" fill="#4ade80">each chunk = {node: update}, printed the moment</text>
  <text x="48" y="376" font-size="11.5" font-family="monospace" fill="#4ade80">its node finishes</text>
  <text x="48" y="410" font-size="12" fill="#86efac" font-weight="700">The reader sees progress at 1.2s and 2.3s.</text>

  <!-- ===== INVOKE terminal ===== -->
  <rect x="480" y="152" width="430" height="332" rx="10" fill="#0b1220" stroke="#d97706"/>
  <rect x="480" y="152" width="430" height="32" rx="10" fill="#d97706"/>
  <rect x="480" y="170" width="430" height="14" fill="#d97706"/>
  <text x="498" y="173" font-size="13" font-weight="700" fill="#ffffff">invoke(&#8230;)</text>

  <g font-family="monospace" font-size="12.5">
    <text x="498" y="214" fill="#64748b">0.0s</text><text x="542" y="214" fill="#e2e8f0">&#9654; run started</text>
    <text x="498" y="248" fill="#64748b">&#183;&#183;&#183;&#183;</text><text x="542" y="248" fill="#475569">(waiting &#8212; nothing returned yet)</text>
    <text x="498" y="282" fill="#64748b">&#183;&#183;&#183;&#183;</text><text x="542" y="282" fill="#475569">(still running&#8230;)</text>
    <text x="498" y="316" fill="#64748b">2.6s</text><text x="542" y="316" fill="#fbbf24">&#9664; returns final state, all at once:</text>
    <text x="560" y="342" fill="#e2e8f0">[step 1] upward loop reuses the item</text>
    <text x="560" y="362" fill="#e2e8f0">[step 2] fix: iterate capacity downward</text>
    <text x="560" y="382" fill="#e2e8f0">done &#8212; 2 steps</text>
  </g>
  <line x1="498" y1="402" x2="892" y2="402" stroke="#1e293b"/>
  <text x="498" y="424" font-size="12" fill="#fcd34d" font-weight="700">The reader sees nothing until 2.6s.</text>

  <!-- takeaway -->
  <rect x="30" y="500" width="880" height="42" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="470" y="526" font-size="13.5" text-anchor="middle" fill="#0f172a"><tspan font-weight="700">Identical result at 2.6s</tspan> &#8212; streaming just surfaced steps 1 and 2 as they happened, instead of at the end.</text>
</svg>
