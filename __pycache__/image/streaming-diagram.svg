<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="aa" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="agr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <rect x="1" y="1" width="918" height="618" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">What &#8220;streaming&#8221; means</text>
  <text x="40" y="68" font-size="14" fill="#64748b">invoke() vs stream() &#8212; the same bounded debug loop, delivered two different ways</text>

  <!-- ================= INVOKE ================= -->
  <rect x="28" y="88" width="864" height="214" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="116" font-size="15" font-weight="700" fill="#b45309">invoke() &#8212; wait, then one result</text>

  <text x="46" y="156" font-size="12" fill="#64748b">Caller</text>
  <rect x="112" y="134" width="758" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="132" y="156" font-size="12.5" font-style="italic" fill="#64748b">no output while the loop runs&#8230;</text>

  <!-- final-state arrow -->
  <path d="M652,259 L666,259" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M666,255 L666,172" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#aa)"/>
  <text x="680" y="150" font-size="12.5" font-weight="700" fill="#b45309">final state</text>
  <text x="680" y="166" font-size="11.5" fill="#94a3b8">(all 3 steps at once)</text>

  <!-- nodes -->
  <line x1="272" y1="259" x2="336" y2="259" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="462" y1="259" x2="526" y2="259" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="150" y="236" width="122" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="211" y="264" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9312;</text>
  <rect x="340" y="236" width="122" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="401" y="264" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9313;</text>
  <rect x="530" y="236" width="122" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="591" y="264" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9314;</text>
  <text x="150" y="298" font-size="11" fill="#64748b">one node, looped 3&#215; by the router (bounded by <tspan font-style="italic">limit</tspan>)</text>

  <!-- ================= STREAM ================= -->
  <rect x="28" y="318" width="864" height="252" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="346" font-size="15" font-weight="700" fill="#15803d">stream() &#8212; an update as each node finishes</text>

  <text x="46" y="384" font-size="12" fill="#64748b">Caller</text>
  <rect x="112" y="362" width="758" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <!-- chunk tags -->
  <rect x="174" y="367" width="74" height="24" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="211" y="383" font-size="12" font-weight="600" text-anchor="middle" fill="#14532d">step 1</text>
  <rect x="364" y="367" width="74" height="24" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="401" y="383" font-size="12" font-weight="600" text-anchor="middle" fill="#14532d">step 2</text>
  <rect x="554" y="367" width="74" height="24" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="591" y="383" font-size="12" font-weight="600" text-anchor="middle" fill="#14532d">step 3</text>
  <text x="648" y="383" font-size="12" fill="#15803d">&#8230; then END</text>

  <!-- arrows up as each node finishes -->
  <path d="M211,470 L211,398" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#agr)"/>
  <path d="M401,470 L401,398" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#agr)"/>
  <path d="M591,470 L591,398" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#agr)"/>
  <text x="220" y="440" font-size="10.5" fill="#16a34a">emitted as it finishes</text>

  <!-- nodes -->
  <line x1="272" y1="497" x2="336" y2="497" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="462" y1="497" x2="526" y2="497" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="150" y="474" width="122" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="211" y="502" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9312;</text>
  <rect x="340" y="474" width="122" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="401" y="502" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9313;</text>
  <rect x="530" y="474" width="122" height="46" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="591" y="502" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9314;</text>
  <text x="150" y="540" font-size="11" fill="#64748b"><tspan font-family="monospace">stream_mode="updates"</tspan> &#8594; one chunk per node: <tspan font-family="monospace">{node_name: state_update}</tspan></text>

  <!-- takeaway -->
  <text x="40" y="600" font-size="13.5" fill="#0f172a"><tspan font-weight="700">Streaming changes when the caller sees each step</tspan> &#8212; not what the graph computes, nor its final result.</text>
</svg>
