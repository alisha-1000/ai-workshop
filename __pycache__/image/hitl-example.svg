<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="938" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Human-in-the-loop &#8212; a worked example</text>
  <text x="40" y="65" font-size="13.5" fill="#64748b">Debugging the knapsack bug: the graph pauses after each step and waits for your call.</text>

  <!-- terminal -->
  <rect x="30" y="88" width="880" height="404" rx="10" fill="#0b1220" stroke="#7c3aed"/>
  <rect x="30" y="88" width="880" height="32" rx="10" fill="#7c3aed"/>
  <rect x="30" y="106" width="880" height="14" fill="#7c3aed"/>
  <text x="48" y="109" font-size="12.5" font-weight="700" fill="#ffffff" font-family="monospace">thread_id = day-2-human-loop&#160;&#160;&#183;&#160;&#160;limit = 5</text>

  <g font-family="monospace" font-size="13">
    <text x="48" y="150" fill="#475569">&#8212;&#8212; step 1 &#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;</text>
    <text x="48" y="178" fill="#60a5fa">analyze</text><text x="140" y="178" fill="#e2e8f0">&#9656; cause: upward loop reuses the item</text>
    <text x="140" y="202" fill="#e2e8f0">&#9656; fix:&#160;&#160; iterate capacity downward</text>
    <text x="48" y="230" fill="#a78bfa">pause</text><text x="140" y="230" fill="#c4b5fd">&#9656; interrupt: &#8220;Try again or end?&#8221;</text>
    <text x="48" y="254" fill="#4ade80">you</text><text x="140" y="254" fill="#e2e8f0">&#9656; invoke(Command(resume=<tspan fill="#4ade80">"retry"</tspan>))</text>

    <text x="48" y="292" fill="#475569">&#8212;&#8212; step 2 &#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;</text>
    <text x="48" y="320" fill="#60a5fa">analyze</text><text x="140" y="320" fill="#e2e8f0">&#9656; confirmed: downward loop is correct</text>
    <text x="140" y="344" fill="#e2e8f0">&#9656; continue_loop = false</text>
    <text x="48" y="372" fill="#a78bfa">pause</text><text x="140" y="372" fill="#c4b5fd">&#9656; interrupt: &#8220;Try again or end?&#8221;</text>
    <text x="48" y="396" fill="#fbbf24">you</text><text x="140" y="396" fill="#e2e8f0">&#9656; invoke(Command(resume=<tspan fill="#fbbf24">"end"</tspan>))</text>

    <text x="48" y="440" fill="#86efac" font-weight="700">&#10003; END &#9656; stopped after 2 steps</text>
  </g>
  <line x1="48" y1="458" x2="892" y2="458" stroke="#1e293b"/>
  <text x="48" y="480" font-size="11.5" font-family="monospace" fill="#94a3b8">each resume is a separate invoke() on the same thread_id &#8212; the checkpointer restores state</text>

  <!-- takeaway -->
  <rect x="30" y="508" width="880" height="42" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="52" y="534" font-size="12.5" fill="#0f172a"><tspan font-weight="700">You decided when it stopped</tspan> &#8212; but the <tspan font-family="monospace">limit</tspan> would end it at step 5 even if you always answered retry.</text>
</svg>
