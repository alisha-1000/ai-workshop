<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="mgr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="mam" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
    <marker id="mv" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="mb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <rect x="1" y="1" width="958" height="518" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="44" font-size="23" font-weight="700" fill="#0f172a">What &#8220;human-in-the-loop&#8221; means</text>
  <text x="40" y="68" font-size="13.5" fill="#64748b">The graph pauses after each step and hands the decision to a person before continuing.</text>

  <!-- retry loop arc (analyze <- human_review) -->
  <path d="M515,140 C515,92 280,92 280,140" stroke="#16a34a" stroke-width="2.2" fill="none" marker-end="url(#mgr)"/>
  <text x="397" y="86" font-size="12" text-anchor="middle" fill="#15803d" font-weight="600">retry &#8594; goto analyze (while iteration &lt; limit)</text>

  <!-- graph row -->
  <line x1="146" y1="170" x2="206" y2="170" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#mg)"/>
  <line x1="350" y1="170" x2="426" y2="170" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#mg)"/>
  <path d="M600,170 L792,170" stroke="#d97706" stroke-width="2.4" fill="none" marker-end="url(#mam)"/>
  <text x="697" y="160" font-size="12" text-anchor="middle" fill="#b45309" font-weight="600">end &#8212; or limit reached</text>

  <rect x="70" y="150" width="76" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="108" y="175" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">START</text>

  <rect x="210" y="144" width="140" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="280" y="169" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze</text>
  <text x="280" y="185" font-size="10.5" text-anchor="middle" fill="#3b82f6">model proposes a step</text>

  <rect x="430" y="144" width="170" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="515" y="167" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">human_review</text>
  <text x="515" y="185" font-size="10.5" text-anchor="middle" fill="#3b82f6">interrupt() &#8212; pauses here</text>

  <rect x="800" y="150" width="76" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="838" y="175" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">END</text>

  <!-- interrupt / resume between graph and human -->
  <path d="M495,198 L495,316" stroke="#7c3aed" stroke-width="2.4" fill="none" marker-end="url(#mv)"/>
  <path d="M545,318 L545,200" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#mb)"/>
  <text x="470" y="243" font-size="12" text-anchor="end" font-weight="700" fill="#7c3aed">interrupt()</text>
  <text x="470" y="259" font-size="11" text-anchor="end" fill="#8b5cf6">diagnosis + fix</text>
  <text x="470" y="273" font-size="11" text-anchor="end" fill="#8b5cf6">sent out; graph waits</text>
  <text x="568" y="247" font-size="12" font-weight="700" fill="#2563eb">Command(resume=&#8230;)</text>
  <text x="568" y="263" font-size="11" fill="#3b82f6">your choice re-enters</text>
  <text x="568" y="277" font-size="11" fill="#3b82f6">the node</text>

  <!-- human card -->
  <rect x="405" y="318" width="230" height="78" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <circle cx="440" cy="350" r="9" fill="#7c3aed"/>
  <path d="M425,376 a15,15 0 0,1 30,0 Z" fill="#7c3aed"/>
  <text x="470" y="349" font-size="14" font-weight="700" fill="#5b21b6">You review the step</text>
  <text x="470" y="370" font-size="12" fill="#6d28d9">decide: <tspan font-weight="700" fill="#15803d">retry</tspan> &#160;or&#160; <tspan font-weight="700" fill="#b45309">end</tspan></text>
  <text x="470" y="387" font-size="11" fill="#8b5cf6">the pause can last seconds &#8212; or days</text>

  <!-- notes -->
  <rect x="40" y="430" width="440" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="453" font-size="12" font-weight="700" fill="#334155">State survives the pause</text>
  <text x="58" y="472" font-size="11.5" fill="#64748b">A <tspan font-family="monospace">MemorySaver</tspan> checkpointer holds the run on a <tspan font-family="monospace">thread_id</tspan>,</text>
  <text x="58" y="486" font-size="11.5" fill="#64748b">so you can resume it later.</text>

  <rect x="500" y="430" width="420" height="60" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="518" y="453" font-size="12" font-weight="700" fill="#334155">Code still has the final say</text>
  <text x="518" y="472" font-size="11.5" fill="#64748b">The iteration <tspan font-family="monospace">limit</tspan> ends the loop even if you</text>
  <text x="518" y="486" font-size="11.5" fill="#64748b">answer <tspan font-weight="700">retry</tspan> every time.</text>
</svg>
