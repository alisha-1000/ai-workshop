<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="gr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- header band -->
  <rect x="0" y="0" width="1280" height="96" fill="#0b1220"/>
  <text x="48" y="40" font-size="14" font-weight="700" letter-spacing="2" fill="#60a5fa">DAY 2 · GRAPH EXECUTION</text>
  <text x="48" y="74" font-size="30" font-weight="700" fill="#ffffff">Streaming — see each step as it finishes</text>

  <text x="48" y="138" font-size="18" fill="#334155"><tspan font-family="monospace" font-weight="700" fill="#15803d">stream()</tspan> emits an update as each node finishes; <tspan font-family="monospace" font-weight="700" fill="#b45309">invoke()</tspan> returns only at the very end.</text>

  <!-- LEFT visual panel -->
  <rect x="48" y="162" width="700" height="426" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="196" font-size="16" font-weight="700" font-family="monospace" fill="#15803d">graph.stream(inputs, stream_mode="updates")</text>

  <!-- chunk tags -->
  <rect x="108" y="222" width="104" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="160" y="242" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">step 1</text>
  <rect x="316" y="222" width="104" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="368" y="242" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">step 2</text>
  <rect x="524" y="222" width="104" height="30" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="576" y="242" font-size="15" font-weight="700" text-anchor="middle" fill="#14532d">step 3</text>
  <text x="644" y="242" font-size="14" fill="#15803d">… END</text>

  <!-- green arrows up (as each finishes) -->
  <path d="M160,330 L160,256" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#gr)"/>
  <path d="M368,330 L368,256" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#gr)"/>
  <path d="M576,330 L576,256" stroke="#16a34a" stroke-width="2.4" fill="none" marker-end="url(#gr)"/>

  <!-- the bounded loop -->
  <rect x="100" y="332" width="120" height="44" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="360" font-size="16" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9312;</text>
  <rect x="308" y="332" width="120" height="44" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="368" y="360" font-size="16" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9313;</text>
  <rect x="516" y="332" width="120" height="44" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="576" y="360" font-size="16" font-weight="600" text-anchor="middle" fill="#1e3a8a">analyze &#9314;</text>
  <line x1="220" y1="354" x2="304" y2="354" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#g)"/>
  <line x1="428" y1="354" x2="512" y2="354" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#g)"/>

  <text x="72" y="410" font-size="14" fill="#64748b">one bounded loop, one chunk per node — printed the moment that node finishes</text>

  <!-- invoke contrast -->
  <rect x="72" y="430" width="652" height="130" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="92" y="460" font-size="15" font-weight="700" fill="#b45309">With invoke() instead:</text>
  <text x="92" y="486" font-size="15" fill="#334155">the caller sees nothing while the loop runs …</text>
  <text x="92" y="512" font-size="15" fill="#334155">… then the whole final state arrives at once, after step 3.</text>
  <text x="92" y="540" font-size="13.5" fill="#92400e">Same computation, same result — only the timing of what the caller sees changes.</text>

  <!-- RIGHT column -->
  <text x="784" y="196" font-size="20" font-weight="700" fill="#0f172a">Why stream?</text>
  <circle cx="792" cy="228" r="4" fill="#16a34a"/>
  <text x="808" y="233" font-size="16" fill="#334155">Show progress live instead of waiting for the end.</text>
  <circle cx="792" cy="264" r="4" fill="#16a34a"/>
  <text x="808" y="269" font-size="16" fill="#334155">Modes: <tspan font-family="monospace">updates</tspan> (deltas) · <tspan font-family="monospace">values</tspan> (full)</text>
  <text x="808" y="291" font-size="16" fill="#334155">· <tspan font-family="monospace">messages</tspan> (token by token).</text>
  <circle cx="792" cy="322" r="4" fill="#16a34a"/>
  <text x="808" y="327" font-size="16" fill="#334155">Day 7 puts the same idea behind SSE for a browser.</text>

  <!-- code block -->
  <rect x="784" y="352" width="448" height="196" rx="10" fill="#0b1220"/>
  <g font-family="monospace" font-size="15" xml:space="preserve">
    <text x="806" y="384" fill="#e2e8f0">for chunk in graph.<tspan fill="#93c5fd">stream</tspan>(</text>
    <text x="806" y="410" fill="#e2e8f0">        inputs, stream_mode=<tspan fill="#86efac">"updates"</tspan>):</text>
    <text x="806" y="436" fill="#e2e8f0">    node, update = next(iter(</text>
    <text x="806" y="462" fill="#e2e8f0">        chunk.items()))</text>
    <text x="806" y="494" fill="#64748b">    # arrives as the node finishes</text>
    <text x="806" y="520" fill="#e2e8f0">    print(node, update[<tspan fill="#86efac">"steps"</tspan>][-1])</text>
  </g>

  <!-- footer takeaway -->
  <rect x="48" y="612" width="1184" height="60" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="72" y="649" font-size="17" fill="#0f172a"><tspan font-weight="700">Streaming changes WHEN the caller sees each step</tspan> — not what the graph computes, nor its final result.</text>
</svg>
