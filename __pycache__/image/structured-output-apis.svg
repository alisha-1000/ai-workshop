<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="1" y="1" width="998" height="738" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="44" font-size="23" font-weight="700" fill="#0f172a">Structured output &#8212; OpenAI vs Anthropic APIs</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Same goal: make the model return a typed object. Requested two different ways &#8212; what LangChain's <tspan font-family="monospace" fill="#475569">with_structured_output()</tspan> hides.</text>

  <!-- ===== OpenAI panel ===== -->
  <rect x="30" y="88" width="460" height="336" rx="10" fill="#0b1220" stroke="#10a37f"/>
  <rect x="30" y="88" width="460" height="32" rx="10" fill="#10a37f"/>
  <rect x="30" y="106" width="460" height="14" fill="#10a37f"/>
  <text x="48" y="109" font-size="13" font-weight="700" fill="#ffffff">OpenAI &#183; response_format (Structured Outputs)</text>
  <rect x="38" y="206" width="444" height="22" rx="4" fill="#10a37f" fill-opacity="0.20"/>
  <g font-family="monospace" font-size="12.5" fill="#dbe4f0" xml:space="preserve">
    <text x="48" y="152">resp = client.chat.completions.<tspan fill="#93c5fd">parse</tspan>(</text>
    <text x="48" y="174">    model=<tspan fill="#86efac">"gpt-4o"</tspan>,</text>
    <text x="48" y="196">    messages=msgs,</text>
    <text x="48" y="222">    <tspan fill="#34d399" font-weight="700">response_format</tspan>=DebugStep,  <tspan fill="#64748b"># Pydantic &#8594; JSON Schema</tspan></text>
    <text x="48" y="244">)</text>
    <text x="48" y="284">obj = resp.choices[0].message.<tspan fill="#34d399" font-weight="700">parsed</tspan></text>
    <text x="48" y="322" fill="#64748b"># strict schema &#8594; guaranteed valid JSON</text>
    <text x="48" y="344" fill="#64748b"># object; also .content holds the JSON text</text>
  </g>

  <!-- ===== Anthropic panel ===== -->
  <rect x="510" y="88" width="460" height="336" rx="10" fill="#0b1220" stroke="#d97757"/>
  <rect x="510" y="88" width="460" height="32" rx="10" fill="#d97757"/>
  <rect x="510" y="106" width="460" height="14" fill="#d97757"/>
  <text x="528" y="109" font-size="13" font-weight="700" fill="#ffffff">Anthropic &#183; tool use (forced)</text>
  <rect x="518" y="228" width="444" height="22" rx="4" fill="#d97757" fill-opacity="0.22"/>
  <rect x="518" y="272" width="444" height="44" rx="4" fill="#d97757" fill-opacity="0.22"/>
  <g font-family="monospace" font-size="12.5" fill="#dbe4f0" xml:space="preserve">
    <text x="528" y="152">msg = client.messages.<tspan fill="#93c5fd">create</tspan>(</text>
    <text x="528" y="174">    model=<tspan fill="#86efac">"claude-sonnet-4"</tspan>,</text>
    <text x="528" y="196">    tools=[{</text>
    <text x="528" y="218">      <tspan fill="#86efac">"name"</tspan>: <tspan fill="#86efac">"DebugStep"</tspan>,</text>
    <text x="528" y="244">      <tspan fill="#fbbf24" font-weight="700">"input_schema"</tspan>: schema,</text>
    <text x="528" y="266">    }],</text>
    <text x="528" y="288">    <tspan fill="#fbbf24" font-weight="700">tool_choice</tspan>={<tspan fill="#86efac">"type"</tspan>: <tspan fill="#86efac">"tool"</tspan>,</text>
    <text x="528" y="310">                 <tspan fill="#86efac">"name"</tspan>: <tspan fill="#86efac">"DebugStep"</tspan>},</text>
    <text x="528" y="332">    messages=msgs,</text>
    <text x="528" y="354">)</text>
    <text x="528" y="392">obj = next(b.<tspan fill="#34d399" font-weight="700">input</tspan> for b in msg.content</text>
    <text x="528" y="410">           if b.type == <tspan fill="#86efac">"tool_use"</tspan>)</text>
  </g>

  <!-- captions -->
  <text x="40" y="446" font-size="12" fill="#0f172a"><tspan font-weight="700" fill="#0f766e">OpenAI:</tspan> the schema is the <tspan font-family="monospace">response_format</tspan>; the object comes back in the message itself.</text>
  <text x="40" y="466" font-size="12" fill="#0f172a"><tspan font-weight="700" fill="#b45309">Anthropic:</tspan> the schema is a tool's <tspan font-family="monospace">input_schema</tspan>; you force that tool, and read the object from its <tspan font-family="monospace">tool_use</tspan> block.</text>

  <!-- ===== comparison table ===== -->
  <rect x="30" y="486" width="940" height="222" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="300" y1="486" x2="300" y2="708" stroke="#e2e8f0"/>
  <line x1="635" y1="486" x2="635" y2="708" stroke="#e2e8f0"/>
  <rect x="30" y="486" width="940" height="34" rx="10" fill="#eef2f6"/>
  <rect x="30" y="504" width="940" height="16" fill="#eef2f6"/>
  <text x="48" y="508" font-size="12.5" font-weight="700" fill="#334155">Aspect</text>
  <text x="318" y="508" font-size="12.5" font-weight="700" fill="#0f766e">OpenAI</text>
  <text x="653" y="508" font-size="12.5" font-weight="700" fill="#b45309">Anthropic</text>

  <g font-size="12.5">
    <line x1="30" y1="558" x2="970" y2="558" stroke="#eef2f6"/>
    <line x1="30" y1="596" x2="970" y2="596" stroke="#eef2f6"/>
    <line x1="30" y1="634" x2="970" y2="634" stroke="#eef2f6"/>
    <line x1="30" y1="672" x2="970" y2="672" stroke="#eef2f6"/>

    <text x="48" y="544" font-weight="600" fill="#334155">Mechanism</text>
    <text x="318" y="544" fill="#334155">dedicated <tspan font-family="monospace">response_format</tspan></text>
    <text x="653" y="544" fill="#334155">tool use (function calling)</text>

    <text x="48" y="582" font-weight="600" fill="#334155">Schema goes in</text>
    <text x="318" y="582" fill="#334155" font-family="monospace">json_schema.schema</text>
    <text x="653" y="582" fill="#334155" font-family="monospace">tools[].input_schema</text>

    <text x="48" y="620" font-weight="600" fill="#334155">Force the shape</text>
    <text x="318" y="620" fill="#334155"><tspan font-family="monospace">"strict": true</tspan></text>
    <text x="653" y="620" fill="#334155"><tspan font-family="monospace">tool_choice={type,name}</tspan></text>

    <text x="48" y="658" font-weight="600" fill="#334155">Result lands in</text>
    <text x="318" y="658" fill="#334155"><tspan font-family="monospace">message.parsed</tspan> / content</text>
    <text x="653" y="658" fill="#334155">a <tspan font-family="monospace">tool_use</tspan> block's <tspan font-family="monospace">.input</tspan></text>

    <text x="48" y="696" font-weight="600" fill="#334155">Schema language</text>
    <text x="318" y="696" fill="#334155">JSON Schema</text>
    <text x="653" y="696" fill="#334155">JSON Schema &#8212; same</text>
  </g>

  <text x="40" y="730" font-size="12" fill="#64748b">The workshop's gateway speaks the OpenAI protocol, so <tspan font-family="monospace">with_structured_output()</tspan> takes the left-hand path.</text>
</svg>
