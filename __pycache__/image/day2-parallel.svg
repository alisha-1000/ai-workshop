<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="1" y="1" width="978" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Concept 1 &#8212; Parallel execution</text>
  <text x="40" y="72" font-size="13.5" fill="#64748b">Nodes ready at the same time run together in one <tspan font-weight="700">superstep</tspan>; a reducer merges their writes.</text>

  <!-- superstep bracket -->
  <rect x="285" y="132" width="180" height="286" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-dasharray="5 4"/>
  <text x="375" y="126" font-size="12.5" text-anchor="middle" fill="#2563eb" font-weight="600">one superstep &#8212; all three run at once</text>

  <!-- START -->
  <rect x="48" y="252" width="86" height="44" rx="22" fill="#e2e8f0" stroke="#64748b"/>
  <text x="91" y="279" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">START</text>

  <!-- fan-out arrows -->
  <path d="M136,270 C210,270 210,176 296,176" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <path d="M136,274 L296,274" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <path d="M136,278 C210,278 210,372 296,372" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#g)"/>

  <!-- specialists -->
  <rect x="300" y="152" width="150" height="48" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="375" y="181" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">syntax</text>
  <rect x="300" y="250" width="150" height="48" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="375" y="279" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">runtime</text>
  <rect x="300" y="348" width="150" height="48" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="375" y="377" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">logic</text>

  <!-- fan-in arrows (labeled with the write each returns) -->
  <path d="M450,176 C520,176 520,268 556,268" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#b)"/>
  <path d="M450,274 L556,274" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#b)"/>
  <path d="M450,372 C520,372 520,280 556,280" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#b)"/>
  <text x="486" y="200" font-size="10.5" fill="#2563eb" font-family="monospace">+[syntax]</text>
  <text x="486" y="262" font-size="10.5" fill="#2563eb" font-family="monospace">+[runtime]</text>
  <text x="486" y="352" font-size="10.5" fill="#2563eb" font-family="monospace">+[logic]</text>

  <!-- finalize (fan-in) -->
  <rect x="560" y="250" width="140" height="48" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="630" y="273" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">finalize</text>
  <text x="630" y="289" font-size="10" text-anchor="middle" fill="#3b82f6">waits for all three</text>

  <!-- merged list -->
  <path d="M700,274 L742,274" stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#g)"/>
  <rect x="744" y="228" width="196" height="92" rx="9" fill="#0b1220"/>
  <text x="758" y="252" font-size="11.5" font-family="monospace" fill="#86efac">diagnoses = [</text>
  <text x="770" y="270" font-size="11.5" font-family="monospace" fill="#e2e8f0">"[syntax] &#8230;",</text>
  <text x="770" y="286" font-size="11.5" font-family="monospace" fill="#e2e8f0">"[runtime] &#8230;",</text>
  <text x="770" y="302" font-size="11.5" font-family="monospace" fill="#e2e8f0">"[logic] &#8230;" ]</text>

  <!-- callout -->
  <rect x="40" y="452" width="900" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="478" font-size="12.5" fill="#0f172a"><tspan font-family="monospace" font-weight="700">diagnoses: Annotated[list, add]</tspan> &#8212; the reducer concatenates the three concurrent writes into one list.</text>
  <text x="58" y="502" font-size="12.5" fill="#0f172a">Without a reducer, three nodes writing the same key in one superstep raise <tspan font-family="monospace" fill="#b91c1c">InvalidUpdateError</tspan> &#8212; LangGraph won't guess how to merge them.</text>
</svg>
